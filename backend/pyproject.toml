[project]
name = "sparestracker-marketing-agent"
version = "0.1.0"
description = "Private SEO and marketing analysis for Sparestracker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "alembic>=1.14,<2.0",
    "cryptography>=44.0,<46.0",
    "defusedxml>=0.7.1,<1.0",
    "google-auth>=2.36,<3.0",
    "httpx>=0.27,<1.0",
    "openai>=1.68,<3.0",
    "python-dotenv>=1.0,<2.0",
    "requests>=2.32,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
